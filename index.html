
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROJECT ECHO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-shell">
  <header>
    <div class="brand">
      <strong>PROJECT: ECHO</strong>
      <small>THE FORGOTTEN FACILITY</small>
    </div>
    <div class="mission">
      <span>CHAPTER 01</span>
      <small id="objective">Explore a instalação</small>
    </div>
    <button id="pause">Ⅱ</button>
  </header>

  <main id="game-container">
    <canvas id="game"></canvas>

    <div id="hud">
      <span id="status">EXPLORANDO</span>
      <span>CHECKPOINT <b id="checkpoint">01</b></span>
    </div>

    <div id="message" class="hidden">
      <h1>FASE CONCLUÍDA</h1>
      <p>Você escapou da instalação.</p>
      <button id="again">RECOMEÇAR</button>
    </div>

    <div id="pause-screen" class="hidden">
      <h1>PAUSADO</h1>
      <button id="resume">CONTINUAR</button>
      <button id="restart">REINICIAR</button>
    </div>

    <div id="controls">
      <div class="left-controls">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="right-controls">
        <button data-key="slide">▼</button>
        <button data-key="jump">▲</button>
      </div>
    </div>
  </main>

  <footer>
    <span>PROJECT ECHO</span>
    <span>BUILD 1.1</span>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
